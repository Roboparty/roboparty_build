name: Build kernel debs

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }} / kernel debs
    runs-on: [self-hosted, a100]
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: robopi2
            label: robopi2-current
          - target: opi5plus
            label: orangepi5-plus-current
          - target: rdk
            label: rdk-x5-vendor-rt
    concurrency:
      group: build-kernel-${{ github.repository }}-${{ github.ref }}-${{ matrix.label }}
      cancel-in-progress: false
    steps:
      - name: Fix workspace permissions
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Sync latest branch code
        if: github.ref_type == 'branch'
        run: |
          git fetch --prune origin
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            cache
            toolchains
          key: armbian-kernel-${{ runner.os }}-${{ hashFiles('config/**', 'patch/**', 'extensions/**', 'lib/**', 'requirements.txt') }}
          restore-keys: |
            armbian-kernel-${{ runner.os }}-

      - name: Clean generated directories
        run: |
          sudo rm -rf "$GITHUB_WORKSPACE/userpatches" "$GITHUB_WORKSPACE/output"

      - name: Install build dependencies
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=600
          sudo apt-get install -o DPkg::Lock::Timeout=600 -y --no-install-recommends build-essential ca-certificates ccache device-tree-compiler debootstrap git qemu-user-static rsync zstd

      - name: Build kernel debs
        run: ./build.sh ${{ matrix.target }} kernel

      - name: Collect kernel + source DEBs
        run: |
          mkdir -p output/release-debs
          find output/debs -type f -name 'linux-*.deb' -exec cp -p {} output/release-debs/ \;

      - name: Upload kernel DEBs
        uses: actions/upload-artifact@v4
        with:
          name: kernel-debs-${{ matrix.label }}
          path: output/release-debs/
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-logs-${{ matrix.label }}
          path: output/logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload kernel DEBs to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/release-debs/*.deb
