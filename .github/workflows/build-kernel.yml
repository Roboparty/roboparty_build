name: Build robopi2 image

on:
  push:
    branches: [next]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: robopi2 / noble / current
    runs-on: [self-hosted, a100]
    steps:
      - name: Fix workspace permissions
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Sync latest branch code
        if: github.ref_type == 'branch'
        run: |
          git fetch --prune origin
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            cache
            toolchains
          key: armbian-robopi2-${{ runner.os }}-${{ hashFiles('config/**', 'patch/**', 'extensions/**', 'lib/**') }}
          restore-keys: |
            armbian-robopi2-${{ runner.os }}-

      - name: Clean generated directories
        run: |
          sudo rm -rf "$GITHUB_WORKSPACE/userpatches" "$GITHUB_WORKSPACE/output"

      - name: Install build dependencies
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=600
          sudo apt-get install -o DPkg::Lock::Timeout=600 -y --no-install-recommends build-essential ca-certificates ccache device-tree-compiler debootstrap git qemu-user-static rsync zstd

      - name: Build
        run: |
          ./compile.sh build \
            BOARD=robopi2 \
            BRANCH=current \
            RELEASE=noble \
            CUSTOM_UBUNTU_MIRROR_PORTS=repo.huaweicloud.com/ubuntu-ports/ \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=no \
            KERNEL_CONFIGURE=no \
            VENDOR=roboparty-os \
            PACKAGE_LIST_RM=armbian-zsh

      - name: Collect DEBs
        run: |
          mkdir -p output/release-debs
          find output/debs -type f -name '*.deb' -exec cp -p {} output/release-debs/ \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debs-robopi2-current
          path: output/release-debs/
          retention-days: 7
