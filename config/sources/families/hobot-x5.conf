# D-Robotics Sunrise 5 / RDK X5 SoC family
declare -g ARCH="arm64"
declare -g LINUXFAMILY="hobot-x5"
declare -g KERNEL_MAJOR_MINOR="6.1"
declare -g KERNELSOURCE="https://github.com/D-Robotics/x5-kernel.git"
# Pin the vendor's Ubuntu 24.04 (noble) branch. It is well ahead of "main" and
# carries the ethernet MAC/RGMII, GCC13, display, CAN and SPI-NAND fixes. The
# vendor publishes no tags, so pin the commit directly.
declare -g KERNELBRANCH="commit:6177afbf829f16c742199c708d44ad2358ac377a"
case "${BRANCH}" in
	vendor)
		declare -g KERNELPATCHDIR="archive/hobot-x5-6.1"
		declare -g LINUXCONFIG="linux-hobot-x5-vendor"
		;;
	vendor-rt)
		declare -g KERNELPATCHDIR="archive/hobot-x5-rt-6.1"
		declare -g LINUXCONFIG="linux-hobot-x5-vendor-rt"
		;;
	*)
		exit_with_error "Unsupported RDK X5 kernel branch" "${BRANCH}"
		;;
esac
declare -g KERNEL_IMAGE_TYPE="Image"
declare -g KERNEL_BTF="no"
declare -g EXTRAWIFI="no"
declare -g ATF_COMPILE="no"

# Match the official RDK image: 4 MiB gap, 256 MiB CONFIG FAT partition,
# followed by the ext4 root filesystem. The boot files remain in rootfs /boot.
declare -g IMAGE_PARTITION_TABLE="msdos"
declare -g OFFSET="4"
declare -g UEFISIZE="256"
declare -g UEFI_MOUNT_POINT="/boot/config"
declare -g UEFI_FS_LABEL="CONFIG"
declare -g ROOT_FS_LABEL="rootfs"

declare -g BOOTSCRIPT="boot-hobot-x5.cmd:boot.cmd"
declare -g BOOTENV_FILE="hobot-x5.txt"
declare -g NETWORKING_STACK="network-manager"
declare -g INSTALL_HEADERS="yes"
declare -g CPUMIN="300000"
declare -g CPUMAX="1500000"
declare -g GOVERNOR="ondemand"

# The vendor U-Boot scans the active MBR partition for /boot/boot.scr. Keep
# partition 1 as a regular FAT32 CONFIG volume and mark ext4 partition 2 active,
# exactly as the official pack_image.sh does.
function post_create_partitions__hobot_x5_vendor_boot_partition() {
	display_alert "Setting RDK X5 partition flags" "FAT32 CONFIG + active ext4 rootfs" "info"
	run_host_command_logged parted -s "${SDCARD}.raw" set 1 esp off
	run_host_command_logged sfdisk --part-type "${SDCARD}.raw" 1 c
	run_host_command_logged parted -s "${SDCARD}.raw" set 2 boot on
}

# The manifest overlays this repository into the otherwise empty camsys path
# inside x5-kernel. Keep it pinned alongside the kernel commit.
declare -g HOBOT_X5_CAMSYS_SOURCE="https://github.com/D-Robotics/x5-drv-camsys.git"
declare -g HOBOT_X5_CAMSYS_BRANCH="commit:22c7c2e870622fe779d832ef1753b27191772cdd"

function fetch_sources_tools__hobot_x5_camsys() {
	fetch_from_repo "${HOBOT_X5_CAMSYS_SOURCE}" "hobot-x5-camsys" "${HOBOT_X5_CAMSYS_BRANCH}"
}

function kernel_copy_extra_sources__hobot_x5_camsys() {
	local camsys_source="${SRC}/cache/sources/hobot-x5-camsys"
	local camsys_destination="${kernel_work_dir}/drivers/media/platform/horizon/camsys"

	if [[ ! -d "${camsys_source}/.git" ]]; then
		fetch_from_repo "${HOBOT_X5_CAMSYS_SOURCE}" "hobot-x5-camsys" "${HOBOT_X5_CAMSYS_BRANCH}"
	fi
	[[ -d "${camsys_source}" ]] || exit_with_error "RDK X5 camsys source is missing" "${camsys_source}"
	rm -rf "${camsys_destination}"
	mkdir -p "${camsys_destination}"
	rsync -a --exclude='.git' "${camsys_source}/" "${camsys_destination}/"
}

# The pinned vendor kernel carries the matching PREEMPT_RT patch as a tracked
# source file. Stage it before the regular Armbian patch series for vendor-rt.
function kernel_extra_create_patches__hobot_x5_preempt_rt() {
	[[ "${BRANCH}" == "vendor-rt" ]] || return 0

	local rt_patch="${kernel_work_dir}/patch-6.1.83-rt28.patch"
	[[ -f "${rt_patch}" ]] || exit_with_error "RDK X5 PREEMPT_RT patch is missing" "${rt_patch}"

	kernel_drivers_patch_file="${kernel_drivers_patch_file:+${kernel_drivers_patch_file} }${rt_patch}"
	kernel_drivers_patch_hash="${kernel_drivers_patch_hash:+${kernel_drivers_patch_hash} }2b65c810730866cbdbdb61ac0d7e90606878eba08182eda4422f210786935aaa"
}

# The vendor defconfig turns warnings into errors. Armbian toolchains are newer
# than the vendor GCC 11 toolchain, so keep warnings non-fatal for this port.
function custom_kernel_make_params__hobot_x5() {
	common_make_params_quoted+=("WERROR=0")
}

function post_family_tweaks_bsp__hobot_x5_boot_support() {
	# Jammy's systemd package owns this path directly. Keeping Armbian's common
	# copy in the board BSP makes dpkg reject the BSP during image creation.
	rm -f "${destination}/usr/lib/sysctl.d/50-default.conf"

	# The vendor kernel opens the AIC8800 blobs directly from this path (see
	# CONFIG_AIC_FW_PATH) and expects the matched D-Robotics set, including the
	# _h_u02 variants and power limit table. The armbian-firmware copies under
	# /lib/firmware/aic8800 are a different revision, so ship the vendor set.
	install -d -m 0755 "${destination}/vendor/etc/firmware"
	cp -a "${SRC}/packages/bsp/hobot-x5/vendor/etc/firmware/." "${destination}/vendor/etc/firmware/"

	install -d -m 0755 "${destination}/lib/modprobe.d" "${destination}/lib/modules-load.d"

	cat > "${destination}/lib/modprobe.d/blacklist-x5.conf" <<- 'EOF'
		blacklist snd_soc_hobot_snd_card
		blacklist hobot_mipi_phy
	EOF

	cat > "${destination}/lib/modules-load.d/20-hobot_uvcvideo.conf" <<- 'EOF'
		uvcvideo
	EOF

	cat > "${destination}/lib/modprobe.d/aic8800.conf" <<- 'EOF'
		# The BSP module uploads the SDIO firmware before the fullmac driver binds.
		softdep aic8800_fdrv pre: aic8800_bsp
		softdep aic8800_btlpm pre: aic8800_bsp
	EOF

	cat > "${destination}/lib/modules-load.d/20-aic8800.conf" <<- 'EOF'
		aic8800_bsp
		aic8800_fdrv
	EOF
}

# Make the D-Robotics user-space repository (hobot-* / TROS) available without
# ever installing the vendor kernel. The vendor hobot-boot/hobot-dtb packages
# ship the D-Robotics kernel and DTB, which would conflict with the Armbian
# kernel. Ship Armbian placeholders under those exact names depending on the
# Armbian kernel packages, and pin the vendor ones to never be installed.
function post_family_tweaks__hobot_x5_hobot_repo() {
	[[ "${BRANCH}" == "vendor" || "${BRANCH}" == "vendor-rt" ]] || return 0

	local repo_url repo_suite
	case "${RELEASE}" in
		noble)
			repo_url="http://archive.d-robotics.cc/ubuntu-rdk-x5-beta"
			repo_suite="noble"
			;;
		*)
			repo_url="http://archive.d-robotics.cc/ubuntu-rdk-x5"
			repo_suite="jammy"
			;;
	esac

	display_alert "Adding D-Robotics package repository" "${repo_url} ${repo_suite}" "info"

	install -d -m 0755 "${SDCARD}/usr/share/keyrings" "${SDCARD}/etc/apt/sources.list.d" "${SDCARD}/etc/apt/preferences.d"
	install -m 0644 "${SRC}/packages/bsp/hobot-x5/usr/share/keyrings/sunrise.gpg" "${SDCARD}/usr/share/keyrings/sunrise.gpg"

	cat > "${SDCARD}/etc/apt/sources.list.d/sunrise.list" <<- EOF
		# D-Robotics RDK X5 user-space packages (hobot-*, TROS)
		deb [signed-by=/usr/share/keyrings/sunrise.gpg] ${repo_url} ${repo_suite} main
	EOF

	# The D-Robotics repo must never shadow or replace Armbian/Ubuntu packages.
	# - vendor kernel/DTB/headers/bootloader would clobber the Armbian kernel
	# - the RDK X-server fork (2:21.1.14) outranks Ubuntu jammy (2:21.1.4)
	# Order matters: apt uses the FIRST matching specific-form record. All
	# records below use `Pin: origin`, so they are all specific-form.
	# NOTE: `Pin: origin` matches the repo *hostname*. If the mirror/domain in
	# sunrise.list changes, update it here too, or these pins silently stop
	# matching (the `9:` placeholder still protects the kernel, but not X).
	cat > "${SDCARD}/etc/apt/preferences.d/sunrise.pref" <<- 'EOF'
		# Never install the vendor kernel/DTB/headers/bootloader.
		Package: hobot-boot hobot-dtb hobot-kernel-headers hobot-miniboot
		Pin: origin "archive.d-robotics.cc"
		Pin-Priority: -1

		# Never let the vendor X fork replace Ubuntu's.
		Package: xserver-common xserver-xorg-core
		Pin: origin "archive.d-robotics.cc"
		Pin-Priority: -1

		# The user-space families we do want, at normal priority.
		Package: hobot-* tros-*
		Pin: origin "archive.d-robotics.cc"
		Pin-Priority: 500

		# Everything else from the vendor repo: below Ubuntu so it can never
		# shadow a same-named Ubuntu package; vendor-only names still install.
		Package: *
		Pin: origin "archive.d-robotics.cc"
		Pin-Priority: 100
	EOF

	# Placeholders for hobot-boot/hobot-dtb, built on the fly and installed into
	# the image so the hobot-* packages resolve without pulling the vendor kernel.
	# NOTE: keep placeholder versions above the vendor's. If D-Robotics ever
	# switches to strict deps (hobot-boot (= 3.1.0-...)), the 9: placeholder
	# stops satisfying them and must be revisited (align to the vendor version).
	local work_dir
	work_dir="$(mktemp -d)"
	local -a placeholders=(
		"hobot-boot:3.1.0:linux-image-${BRANCH}-${LINUXFAMILY}"
		"hobot-dtb:3.0.8:linux-dtb-${BRANCH}-${LINUXFAMILY}"
	)
	local entry name version depends
	for entry in "${placeholders[@]}"; do
		IFS=: read -r name version depends <<< "${entry}"
		mkdir -p "${work_dir}/${name}/DEBIAN"
		cat > "${work_dir}/${name}/DEBIAN/control" <<- EOF
			Package: ${name}
			Version: 9:${version}
			Architecture: arm64
			Section: metapackages
			Priority: optional
			Depends: ${depends}
			Maintainer: Armbian <build@armbian.com>
			Description: Armbian placeholder for the D-Robotics ${name} package
			 The vendor ${name} package ships the D-Robotics kernel/DTB, which would
			 conflict with the Armbian-built kernel. This placeholder satisfies the
			 hobot-* dependencies and depends on the Armbian kernel packages instead.
		EOF
		run_host_command_logged dpkg-deb --build --root-owner-group "${work_dir}/${name}" "${work_dir}/${name}.deb"
	done

	install -d -m 0755 "${SDCARD}/tmp/hobot-placeholders"
	install -m 0644 "${work_dir}/hobot-boot.deb" "${work_dir}/hobot-dtb.deb" "${SDCARD}/tmp/hobot-placeholders/"
	chroot_sdcard dpkg --install /tmp/hobot-placeholders/hobot-boot.deb /tmp/hobot-placeholders/hobot-dtb.deb
	run_host_command_logged rm -rf "${work_dir}" "${SDCARD}/tmp/hobot-placeholders"
}
