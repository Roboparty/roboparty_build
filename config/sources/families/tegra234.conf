# NVIDIA Tegra234 (Jetson Orin NX/Nano) family
#
# Route A: Armbian builds only the kernel (and the rootfs); the vendor UEFI
# already flashed in QSPI boots /boot/extlinux/extlinux.conf, and image
# assembly/flashing is done by the NVIDIA L4T BSP (flash.sh / l4t_initrd_flash.sh).
# Kernel and DTS come straight from the nv-tegra GitLab mirror used by
# Linux_for_Tegra/source/source_sync.sh.
declare -g ARCH="arm64"
declare -g LINUXFAMILY="tegra234"

case "${BRANCH}" in
	l4t39)
		declare -g KERNEL_MAJOR_MINOR="6.8"
		declare -g KERNELSOURCE="https://gitlab.com/nvidia/nv-tegra/3rdparty/canonical/linux-noble.git"
		# L4T 39.2 / JetPack 7.2 (Ubuntu noble packaging, kernel 6.8.12).
		declare -g KERNELBRANCH="branch:l4t/l4t-r39.2-Ubuntu-nvidia-tegra-6.8.0-1021.21"
		declare -g KERNELPATCHDIR="archive/tegra234-6.8"
		declare -g LINUXCONFIG="linux-tegra234-l4t39"
		;;
	*)
		exit_with_error "Unsupported Tegra234 kernel branch" "${BRANCH}"
		;;
esac

declare -g KERNEL_IMAGE_TYPE="Image"
declare -g KERNEL_BTF="no"
declare -g EXTRAWIFI="no"
declare -g ATF_COMPILE="no"

# The vendor UEFI loads extlinux.conf from the root filesystem, so no Armbian
# bootscript/boot.scr is generated or required.
declare -g SRC_EXTLINUX="yes"
declare -g IMAGE_PARTITION_TABLE="gpt"
declare -g NETWORKING_STACK="network-manager"
declare -g INSTALL_HEADERS="yes"

# Record the OOT switch, tag and enabled build's Makefile contents in the
# kernel artifact version so changes invalidate cached kernel packages.
function custom_kernel_config__tegra234_oot() {
	[[ "${BRANCH}" == "l4t39" ]] || return 0
	kernel_config_modifying_hashes+=("tegra234-oot=${BUILD_TEGRA234_OOT:-no}")
	kernel_config_modifying_hashes+=("tegra234-oot-tag=${TEGRA234_OOT_TAG:-}")
	if [[ "${BUILD_TEGRA234_OOT:-no}" == "yes" ]]; then
		local makefile_hash
		makefile_hash=$(sha256sum "${SRC}/config/sources/vendors/nvidia/tegra234-oot/Makefile") || return 1
		kernel_config_modifying_hashes+=("tegra234-oot-makefile=${makefile_hash%% *}")
	fi
}

# ---------------------------------------------------------------------------
# NVIDIA out-of-tree modules (nvidia-oot / nvgpu / hwpm / display).
#
# These are not in the kernel tree and are built by the L4T "combined" Makefile
# (vendored under config/sources/vendors/nvidia/tegra234-oot/Makefile)
# against the kernel build tree.
# The sources are the very same nv-tegra GitLab repos that Linux_for_Tegra's
# source_sync.sh pulls. The board config carries the switch and the pinned tag
# (BUILD_TEGRA234_OOT / TEGRA234_OOT_TAG); the hooks below are only the wiring.
# ---------------------------------------------------------------------------
function _tegra234_fetch_oot_sources() {
	[[ "${BUILD_TEGRA234_OOT:-no}" == "yes" ]] || return 0
	[[ -n "${TEGRA234_OOT_TAG:-}" ]] || return 0

	local git_server="https://gitlab.com/nvidia/nv-tegra"
	# Directory layout matches what the combined Makefile expects as siblings.
	fetch_from_repo "${git_server}/linux-nv-oot.git" "tegra234-oot/nvidia-oot" "${TEGRA234_OOT_TAG}"
	fetch_from_repo "${git_server}/linux-hwpm.git" "tegra234-oot/hwpm" "${TEGRA234_OOT_TAG}"
	fetch_from_repo "${git_server}/tegra/kernel-src/linux-nvgpu.git" "tegra234-oot/nvgpu" "${TEGRA234_OOT_TAG}"
	fetch_from_repo "${git_server}/tegra/kernel-src/nv-kernel-display-driver.git" "tegra234-oot/nvdisplay" "${TEGRA234_OOT_TAG}"
	fetch_from_repo "${git_server}/tegra/kernel-src/nv-unified-gpu-display-driver.git" "tegra234-oot/unifiedgpudisp" "${TEGRA234_OOT_TAG}"
	# nvethernetrm is nested inside nvidia-oot (its Makefile includes
	# .../nvethernet/nvethernetrm/include/config.tmk), exactly as source_sync.sh
	# syncs it; that is why it must come after the nvidia-oot checkout.
	fetch_from_repo "${git_server}/kernel/nvethernetrm.git" \
		"tegra234-oot/nvidia-oot/drivers/net/ethernet/nvidia/nvethernet/nvethernetrm" "${TEGRA234_OOT_TAG}"
	fetch_from_repo "${git_server}/kernel/build/nvidia-public.git" "tegra234-oot/build/nvidia-public" "${TEGRA234_OOT_TAG}"
}

function fetch_sources_tools__tegra234_oot() {
	_tegra234_fetch_oot_sources
}

# Runs while the linux-image deb is being assembled, so the extra modules land
# in the module install tree and are packaged together with the in-tree ones.
function pre_package_kernel_image__tegra234_oot() {
	[[ "${BUILD_TEGRA234_OOT:-no}" == "yes" ]] || return 0
	[[ "${BRANCH}" == "l4t39" ]] || return 0

	local oot_base="${SRC}/cache/sources/tegra234-oot"
	local kernel_tree="${kernel_work_dir}"
	local mod_install="${tmp_kernel_install_dirs[INSTALL_MOD_PATH]}"

	[[ -d "${kernel_tree}" ]] || exit_with_error "Tegra234 OOT: kernel build tree not found" "${kernel_tree}"
	[[ -n "${mod_install}" ]] || exit_with_error "Tegra234 OOT: INSTALL_MOD_PATH is not set" ""

	# Make sure the OOT sources are around even if fetch_sources_tools was not run.
	_tegra234_fetch_oot_sources
	[[ -d "${oot_base}" ]] || exit_with_error "Tegra234 OOT: sources not fetched" "${oot_base}"

	# The combined Makefile must sit next to the fetched OOT sources.
	install -m 0644 "${SRC}/config/sources/vendors/nvidia/tegra234-oot/Makefile" "${oot_base}/Makefile"

	display_alert "Building NVIDIA OOT modules" "Tegra234 l4t39 (nvidia-oot/nvgpu/hwpm/display)" "info"
	run_host_command_logged make -C "${oot_base}" \
		ARCH=arm64 \
		KERNEL_HEADERS="${kernel_tree}" \
		KERNEL_OUTPUT="${kernel_tree}" \
		CROSS_COMPILE="${KERNEL_COMPILER}" \
		kernel_name=noble system_type=l4t \
		modules

	run_host_command_logged make -C "${oot_base}" \
		ARCH=arm64 \
		KERNEL_HEADERS="${kernel_tree}" \
		KERNEL_OUTPUT="${kernel_tree}" \
		CROSS_COMPILE="${KERNEL_COMPILER}" \
		kernel_name=noble system_type=l4t \
		INSTALL_MOD_PATH="${mod_install}" \
		modules_install

	# Refresh the module dependency map now that the OOT modules are in place.
	run_host_command_logged depmod -b "${mod_install}" -a || true
}
