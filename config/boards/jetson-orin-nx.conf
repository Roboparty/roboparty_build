# NVIDIA Jetson Orin NX (Tegra234 / p3767) — Route A: Armbian rootfs+kernel, L4T flashes
BOARD_NAME="Jetson Orin NX"
BOARD_VENDOR="nvidia"
BOARDFAMILY="tegra234"
BOARD_MAINTAINER="wentywenty"
INTRODUCED="2026"

# Boot firmware is the vendor UEFI (edk2-nvidia) already flashed in QSPI; it loads
# /boot/extlinux/extlinux.conf from the root filesystem. Armbian only produces the
# rootfs + kernel + DTB; image assembly/flashing stays with NVIDIA L4T
# (apply_binaries.sh / l4t_initrd_flash.sh).
BOOTCONFIG="none"
SRC_EXTLINUX="yes"
IMAGE_PARTITION_TABLE="gpt"

# Orin NX is the p3767 module; the p3768 devkit carrier is the reference board.
BOOT_FDT_FILE="nvidia/tegra234-p3768-0000+p3767-0000.dtb"
SERIALCON="ttyTCU0:115200"
# The vendor debug console is the Tegra Combined UART. SRC_EXTLINUX boards get
# their cmdline from extlinux "append", so the console must be listed here.
SRC_CMDLINE="console=ttyTCU0,115200 console=tty0"

KERNEL_TARGET="l4t39"
KERNEL_TEST_TARGET="l4t39"

BOARD_MINIMAL_ONLY="no"
KERNEL_HAS_WORKING_HEADERS="yes"

# NVIDIA out-of-tree modules (nvidia-oot / nvgpu / hwpm / display), built by the
# family hooks from the nv-tegra GitLab mirror pinned to the L4T release tag.
# Use ${VAR:-default} so a command-line override (BUILD_TEGRA234_OOT=no) wins.
BUILD_TEGRA234_OOT="${BUILD_TEGRA234_OOT:-yes}"
TEGRA234_OOT_TAG="${TEGRA234_OOT_TAG:-tag:jetson_39.2.1}"
