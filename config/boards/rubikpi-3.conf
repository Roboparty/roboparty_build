# Qualcomm Dragonwing QCS6490 (Kryo 670) 8GB LPDDR4x, 128GB eMMC, M.2 NVMe, AP6256 WiFi/BT
declare -g BOARD_NAME="RUBIK Pi 3"
declare -g BOARD_VENDOR="thundercomm"
declare -g BOARD_MAINTAINER=""
declare -g INTRODUCED="2026"
declare -g BOARDFAMILY="qcs6490"

# The Rubik Pi 3 device tree is upstream (qcs6490-thundercomm-rubikpi3.dtb), so
# only the mainline "edge" kernel is usable; the Radxa "current" tree does not
# carry this DTB.
declare -g KERNEL_TARGET="edge"
declare -g KERNEL_TEST_TARGET="edge"

declare -g BOOTCONFIG="none"
declare -g IMAGE_PARTITION_TABLE="gpt"

# Complete linux-firmware plus Armbian's; needed for Adreno GPU and remoteprocs.
declare -g BOARD_FIRMWARE_INSTALL="-full"

declare -g BOOT_FDT_FILE="qcom/qcs6490-thundercomm-rubikpi3.dtb"
