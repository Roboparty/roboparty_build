# RoboParty RK3588 board (initially reuses the Orange Pi 5 Plus boot/DTS setup)
BOARD_NAME="robopi2"
BOARD_VENDOR="roboparty"
BOARDFAMILY="rockchip-rk3588"
BOARD_MAINTAINER="wentywenty"
INTRODUCED="2026"
BOOTCONFIG="robopi2-rk3588s_defconfig"
BOOT_SOC="rk3588"
KERNEL_TARGET="current"
KERNEL_TEST_TARGET="current"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3588s-orangepi-cm5-robopi2.dtb"
BOOT_SCENARIO="spl-blobs"
SERIALCON="ttyS2:1500000"
enable_extension "adbd"
enable_extension "ugreen-aic8800"
source "${SRC}/packages/bsp/roboparty/robopi-ws2812.sh"

# Allow RoboPi2 services and user sessions to create SCHED_FIFO threads under cgroup v2.
function armbian_kernel_config__999_robopi2_disable_rt_group_sched() {
	local option_index
	for option_index in "${!opts_y[@]}"; do
		[[ "${opts_y[${option_index}]}" == "RT_GROUP_SCHED" ]] && unset 'opts_y[option_index]'
	done
	opts_n+=("RT_GROUP_SCHED")
}

function post_family_tweaks__robopi2_serial_autologin() {
	local serial_device="${SERIALCON%%:*}"
	local serial_baud="${SERIALCON#*:}"
	local autologin_dir="${SDCARD}/etc/systemd/system/serial-getty@${serial_device}.service.d"

	install -d -m 0755 "${autologin_dir}"
	cat > "${autologin_dir}/autologin.conf" <<- EOF
		[Service]
		ExecStart=
		ExecStart=-/sbin/agetty --autologin robo --keep-baud ${serial_baud},115200,57600,38400,9600 - \$TERM
	EOF
}

# AP6256 firmware aliases, matching the brcm firmware names requested by the DTS.
function post_family_tweaks__robopi2_wifi_firmware() {
	display_alert "$BOARD" "Installing AP6256 firmware aliases" "info"
	mkdir -p "$SDCARD/lib/firmware/brcm/"
	ln -sf brcmfmac43456-sdio.bin "$SDCARD/lib/firmware/brcm/brcmfmac43456-sdio.xunlong,orangepi-5-pro.bin"
	ln -sf brcmfmac43456-sdio.txt "$SDCARD/lib/firmware/brcm/brcmfmac43456-sdio.xunlong,orangepi-5-pro.txt"
	ln -sf brcmfmac43456-sdio.bin "$SDCARD/lib/firmware/brcm/brcmfmac43456-sdio.roboparty,robopi2.bin"
	ln -sf brcmfmac43456-sdio.txt "$SDCARD/lib/firmware/brcm/brcmfmac43456-sdio.roboparty,robopi2.txt"
	return 0
}

# Mainline U-Boot v2025.10 (same RK3588S boot chain as Orange Pi 5 Pro)
function post_family_config__robopi2_use_mainline_uboot() {
	[[ "${BRANCH}" == "vendor" ]] && return 0

	display_alert "${BOARD}" "Mainline U-Boot overrides for ${BOARD} - ${BRANCH}" "info"
	declare -g BOOTCONFIG="robopi2-rk3588s_defconfig"
	declare -g BOOTDELAY=1
	declare -g BOOTSOURCE="https://github.com/u-boot/u-boot.git"
	declare -g BOOTBRANCH="tag:v2025.10"
	declare -g BOOTPATCHDIR="v2025.10"
	declare -g BOOTDIR="u-boot-${BOARD}"
	declare -g UBOOT_TARGET_MAP="BL31=${RKBIN_DIR}/${BL31_BLOB} ROCKCHIP_TPL=${RKBIN_DIR}/${DDR_BLOB};;u-boot-rockchip.bin"
	unset uboot_custom_postprocess write_uboot_platform write_uboot_platform_mtd

	function write_uboot_platform() {
		dd "if=$1/u-boot-rockchip.bin" "of=$2" bs=32k seek=1 conv=notrunc status=none
	}
}
BOOT_SUPPORT_SPI="no"
BOOT_SPI_RKSPI_LOADER="no"
IMAGE_PARTITION_TABLE="gpt"


