# Install the RoboParty XFCE desktop wallpaper for newly-created users.
function post_family_tweaks__roboparty_xfce_wallpaper() {
	if [[ "${BUILD_DESKTOP}" != "yes" || "${DESKTOP_ENVIRONMENT}" != "xfce" ]]; then
		return 0
	fi

	display_alert "${BOARD}" "Configuring XFCE wallpaper" "info"

	local wallpaper_src="${SRC}/packages/bsp/roboparty/robopi-default.png"
	local wallpaper_dst="${SDCARD}/usr/share/backgrounds/roboparty/robopi-default.png"
	local xfce_config="${SDCARD}/etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-desktop.xml"

	if [[ ! -f "${wallpaper_src}" ]]; then
		display_alert "${BOARD}" "Wallpaper not found: ${wallpaper_src}" "wrn"
		return 0
	fi

	mkdir -p "$(dirname "${wallpaper_dst}")" "$(dirname "${xfce_config}")"
	cp -f "${wallpaper_src}" "${wallpaper_dst}"

	cat > "${xfce_config}" <<- 'EOF'
		<?xml version="1.0" encoding="UTF-8"?>
		<channel name="xfce4-desktop" version="1.0">
		  <property name="backdrop" type="empty">
		    <property name="screen0" type="empty">
		      <property name="monitor0" type="empty">
		        <property name="workspace0" type="empty">
		          <property name="last-image" type="string" value="/usr/share/backgrounds/roboparty/robopi-default.png"/>
		          <property name="image-style" type="int" value="5"/>
		          <property name="image-show" type="int" value="0"/>
		        </property>
		      </property>
		    </property>
		  </property>
		</channel>
	EOF
}

# Keep XFCE installed, but do not start a graphical login automatically.
# The desktop can still be started manually with `systemctl start lightdm`.
function post_family_tweaks__robopi2_disable_desktop_autostart() {
	[[ "${BUILD_DESKTOP}" != "yes" ]] && return 0

	display_alert "${BOARD}" "Disabling XFCE display manager autostart" "info"
	if [[ -d "${SDCARD}/etc/systemd/system" ]]; then
		mkdir -p "${SDCARD}/etc/systemd/system"
		ln -sfn /dev/null "${SDCARD}/etc/systemd/system/lightdm.service"
		ln -sfn /dev/null "${SDCARD}/etc/systemd/system/display-manager.service"
	fi
}
